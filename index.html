<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="style.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vite React Template</title>
</head>

<body>
  
  
  
  
  <main>
    <article class="container">
      <form class="formulario">
        <h1 class="titulo">DEV BANK</h1>

        <section class="data">
          <label>Nome:</label>
          <input type="text" placeholder="Digite seu nome completo" id="name">
        </section>

        <section class="data">
          <label>Tipo de conta:</label>
          <input type="text" placeholder="Digite seu tipo de conta" id="tconta">
        </section>


        <section class="data">
          <label>Conta:</label>
          <input type="number" placeholder="00000-0" id="nconta">
        </section>



        <section class="data"> 
          <label>Agência:</label>
          <input type="number" placeholder="0000" id="agencia"> 
        </section>

        <button class="submit_button">Login</button>
      </form> 
    </article>
  </main>
</body>

</html>
